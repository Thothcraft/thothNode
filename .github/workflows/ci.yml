name: thoth-node CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          path: thoth
      # whispy isn't on PyPI — the node SDK lives in the public repo.
      - uses: actions/checkout@v4
        with:
          repository: gadm21/whispy
          path: whispy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install thoth-node + whispy SDK + test deps
        run: |
          python -m pip install -e whispy/packages/whispy -e thoth \
            pytest numpy opencv-python-headless
      - name: Run tests
        run: python -m pytest thoth/tests -x -q
